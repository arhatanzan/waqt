<div class="flex flex-col md:flex-row items-center bg-slate-100 border border-slate-300 rounded-lg p-2 w-full md:w-auto gap-3">
                <div class="flex items-center">
                    <span class="text-xs font-bold text-slate-500 uppercase mr-3 ml-2">Azaan:</span>
                    <button onclick="playAzaan()" class="px-3 py-1.5 text-xs font-bold text-emerald-700 bg-emerald-100 hover:bg-emerald-200 rounded border border-emerald-200 mx-0.5 transition-colors shadow-sm">Play</button>
                    <button onclick="pauseAzaan()" class="px-3 py-1.5 text-xs font-bold text-amber-700 bg-amber-100 hover:bg-amber-200 rounded border border-amber-200 mx-0.5 transition-colors shadow-sm">Pause</button>
                    <button onclick="stopAzaan()" class="px-3 py-1.5 text-xs font-bold text-red-700 bg-red-100 hover:bg-red-200 rounded border border-red-200 mx-0.5 transition-colors shadow-sm">Stop</button>
                </div>
                <div class="flex items-center w-full md:w-48 gap-2 bg-white px-2 py-1.5 rounded border border-slate-200 shadow-inner">
                    <div class="relative w-full h-2 bg-slate-200 rounded overflow-hidden">
                        <div id="audioProgressBar" class="absolute top-0 left-0 h-full bg-emerald-500 w-0 transition-all duration-200"></div>
                    </div>
                    <span id="audioTimeDisplay" class="text-[10px] font-bold text-slate-500 tabular-nums w-16 text-right">00:00</span>
                </div>
            </div>
            <audio id="azaanAudio" src="data/azaan.mp3" preload="metadata"></audio>
